# Build and create DMG.
# SECURITY: Do NOT use pull_request_target — that would expose signing secrets to fork PRs.

name: Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  XCODE_PROJECT: "mow/mow.xcodeproj"
  XCODE_SCHEME: "mow"
  BUILD_DIR: "build"
  APP_NAME: "Mow.app"
  DMG_VOLUME_NAME: "Mów"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Swift macro for CI (LLM package)
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      # Import Developer ID when certificate secret is set. PRs from forks have no secrets.
      # (Cannot use secrets.* in 'if' — GitHub doesn't allow it; check inside the script instead.)
      - name: Import Developer ID certificate
        id: codesign
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 || secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD || secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_BASE64" ]; then
            echo "No certificate secret; will use ad-hoc signing"
            exit 0
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/developer_id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 20)"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Fall back to ad-hoc signing
        if: steps.codesign.outputs.signed != 'true'
        run: echo "CODESIGN_IDENTITY=-" >> "$GITHUB_ENV"

      - name: Resolve Swift packages
        run: |
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -derivedDataPath "$BUILD_DIR" -resolvePackageDependencies

      - name: Patch FluidAudio (Swift 6 / macOS compatibility)
        run: DERIVED="$GITHUB_WORKSPACE/$BUILD_DIR" ./scripts/patch-fluidaudio.sh

      # Build with ad-hoc signing only (no archive). SPM targets fail with "conflicting
      # provisioning settings" if CODE_SIGN_IDENTITY or DEVELOPMENT_TEAM are set.
      # We sign the app and DMG with Developer ID after the build when secrets exist.
      - name: Build
        env:
          # Force ad-hoc so xcodebuild never sees a real identity (avoids SPM conflicts)
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: ""
        run: |
          echo "Building with ad-hoc signing (no archive)..."
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -derivedDataPath "$BUILD_DIR" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            build \
            ARCHS=arm64 \
            MACOSX_DEPLOYMENT_TARGET=14.0 \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM=""

      - name: Sign app (Developer ID)
        if: steps.codesign.outputs.signed == 'true'
        run: |
          APP_PATH="$BUILD_DIR/Build/Products/Release/$APP_NAME"
          ID="$CODESIGN_IDENTITY"
          # Notarization requires every nested binary to be signed with Developer ID + secure timestamp.
          # Sign innermost first (e.g. llama.framework/Versions/A/llama), then frameworks, then app.
          # 1) Binaries inside .framework (e.g. llama.framework/Versions/A/llama)
          find "$APP_PATH/Contents/Frameworks" -type d -name "*.framework" 2>/dev/null | while read fw; do
            for bin in "$fw/Versions/A/"*; do
              [ -f "$bin" ] && file -b "$bin" | grep -q Mach-O && \
                codesign --force --sign "$ID" --options runtime --timestamp "$bin"
            done
            codesign --force --sign "$ID" --options runtime --timestamp "$fw"
          done
          # 2) Any .dylib in Frameworks
          find "$APP_PATH/Contents/Frameworks" -name "*.dylib" -type f 2>/dev/null | while read dylib; do
            codesign --force --sign "$ID" --options runtime --timestamp "$dylib"
          done
          # 3) Main app bundle (must pass entitlements or re-sign strips them and TCC prompt won't show)
          codesign --force --sign "$ID" --options runtime --timestamp --entitlements mow/mow/mow.entitlements "$APP_PATH"

      - name: Run tests
        run: |
          xcodebuild test -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -derivedDataPath "$BUILD_DIR" \
            -destination 'platform=macOS' \
            -resultBundlePath "$BUILD_DIR/TestResults.xcresult" \
            CODE_SIGN_IDENTITY="-" \
            | xcpretty -r junit --no-color || true

      - name: Create DMG
        run: |
          APP_PATH="$BUILD_DIR/Build/Products/Release/$APP_NAME"
          VERSION=$(plutil -extract CFBundleShortVersionString raw "$APP_PATH/Contents/Info.plist" 2>/dev/null || echo "1.0")
          DMG_FILE="mow-${VERSION}.dmg"
          mkdir -p "$BUILD_DIR/dmg-src"
          ln -sf /Applications "$BUILD_DIR/dmg-src/Applications"
          cp -R "$APP_PATH" "$BUILD_DIR/dmg-src/"
          hdiutil create -volname "$DMG_VOLUME_NAME $VERSION" -srcfolder "$BUILD_DIR/dmg-src" -ov -format UDZO "$DMG_FILE"
          echo "DMG_FILE=$DMG_FILE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Sign DMG
        if: steps.codesign.outputs.signed == 'true'
        run: codesign --force --sign "$CODESIGN_IDENTITY" --timestamp "$DMG_FILE"

      - name: Notarize DMG
        if: steps.codesign.outputs.signed == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || secrets.TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_PASSWORD" ]; then
            echo "::error::Notarization requires secrets: APPLE_ID, APPLE_TEAM_ID (or TEAM_ID), and APPLE_APP_SPECIFIC_PASSWORD (or APPLE_APP_PASSWORD)"
            exit 1
          fi
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$DMG_FILE" \
            --keychain-profile "notarytool-profile" \
            --keychain "$KEYCHAIN_PATH" \
            --wait 2>&1) || true
          echo "$SUBMIT_OUTPUT"
          if echo "$SUBMIT_OUTPUT" | grep -q "status: Invalid"; then
            echo "::error::Notarization was rejected by Apple."
            SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | sed -n 's/^[[:space:]]*id:[[:space:]]*//p' | head -1 | tr -d ' ')
            if [ -n "$SUBMISSION_ID" ]; then
              echo "::group::Apple notary log (reason for rejection)"
              xcrun notarytool log "$SUBMISSION_ID" \
                --keychain-profile "notarytool-profile" \
                --keychain "$KEYCHAIN_PATH" 2>&1 || true
              echo "::endgroup::"
            fi
            exit 1
          fi
          xcrun stapler staple "$DMG_FILE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mow-macOS
          path: ${{ env.DMG_FILE }}

      - name: Cleanup signing artifacts
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/developer_id.p12"
          KPATH="${KEYCHAIN_PATH:-$RUNNER_TEMP/signing.keychain-db}"
          if [ -f "$KPATH" ]; then
            security delete-keychain "$KPATH" || true
          fi

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: mow-macOS

      - name: Get version from tag
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mów ${{ steps.tag.outputs.VERSION }}
          draft: false
          files: mow-*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

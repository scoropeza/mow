# SwiftLint config for Mów
# https://github.com/realm/SwiftLint

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - modifier_order
  - multiline_arguments
  - redundant_nil_coalescing
  - sorted_first_last
  - vertical_parameter_alignment_on_call

disabled_rules:
  - trailing_whitespace  # often noisy in generated/mixed files

line_length:
  warning: 120
  error: 160
  ignores_urls: true
  ignores_function_declarations: true

file_length:
  warning: 400
  error: 600

type_body_length:
  warning: 300
  error: 500

identifier_name:
  min_length: 2
  max_length: 50

# Only lint app source; never lint SPM checkouts or build artifacts.
# Paths relative to repo root when running: swiftlint lint --config .swiftlint.yml mow
excluded:
  - mow/mowTests
  - mow/mowUITests
  - .build
  - DerivedData
  - build
  - SourcePackages
  - "*.xcodeproj"

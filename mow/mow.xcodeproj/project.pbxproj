			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Fix FluidAudio Qwen3AsrModels.swift ambiguous type (Swift 6 / newer compiler)\n# Patches the SPM checkout so \"let f16Ptr = ...\" gets an explicit type.\nROOT=\"${BUILD_DIR}\"\nfor _ in 1 2 3 4 5 6 7 8; do\n  [ -d \"${ROOT}/SourcePackages/checkouts/FluidAudio\" ] && break\n  ROOT=\"$(dirname \"$ROOT\")\"\ndone\nFILE=\"${ROOT}/SourcePackages/checkouts/FluidAudio/Sources/FluidAudio/ASR/Qwen3/Qwen3AsrModels.swift\"\nif [ -f \"$FILE\" ]; then\n  if ! grep -q 'let f16Ptr: UnsafePointer<Float16>' \"$FILE\"; then\n    sed -i.bak 's/let f16Ptr = ptr\\.baseAddress!/let f16Ptr: UnsafePointer<Float16> = ptr.baseAddress!/g' \"$FILE\" && rm -f \"${FILE}.bak\"\n    echo \"Patched FluidAudio Qwen3AsrModels.swift\"\n  fi\nfi\n";
			showEnvVarsInLog = 0;
		};
